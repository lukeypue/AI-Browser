name: Build Claude Site Brain v3

on:
  push:
    branches: [ai-browser-v6-deep-search]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: claude-v3-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Prepare canonical AI Browser source
        run: |
          test -f ai-browser/settings.gradle
          python3 scripts/prepare-ai-browser-release.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'

      - name: Run Brain core tests
        working-directory: ai-browser
        run: gradle :brain-core:test --stacktrace

      - name: Run Android unit tests
        working-directory: ai-browser
        run: gradle testDebugUnitTest --stacktrace

      - name: Build debug APK
        working-directory: ai-browser
        run: gradle assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Browser-learning-upgrade-debug
          path: ai-browser/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
