name: Windows browser trainer
on:
  push:
    branches: [codex/windows-browser-trainer, codex/trainer-curriculum-update]
  pull_request:
    paths: [desktop-trainer/**, ai-browser/brain-core/**, scripts/package-desktop-trainer.py, .github/workflows/windows-trainer.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-read-only: false
      - name: Core tests and trainer JAR
        run: gradle -p ai-browser/brain-core test desktopTrainerJar --no-daemon
      - name: Package and extract into a path with spaces
        shell: pwsh
        run: |
          python scripts/package-desktop-trainer.py dist/Site-Brain-Trainer.zip
          $destination = Join-Path $env:RUNNER_TEMP 'Site Brain Package'
          Expand-Archive -LiteralPath dist/Site-Brain-Trainer.zip -DestinationPath $destination
          "TRAINER_ROOT=$destination\Site-Brain-Trainer" >> $env:GITHUB_ENV
      - name: Run the actual portable Windows setup
        shell: pwsh
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$env:TRAINER_ROOT\Setup.ps1" -NoPause
          if ($LASTEXITCODE -ne 0) { throw 'Portable setup failed' }
      - name: Real browser and dashboard tests
        shell: pwsh
        run: |
          $paths = Get-Content "$env:TRAINER_ROOT\.runtime\paths.json" -Raw | ConvertFrom-Json
          $node = Join-Path "$env:TRAINER_ROOT\.runtime" $paths.node
          $env:PLAYWRIGHT_BROWSERS_PATH = "$env:TRAINER_ROOT\.runtime\browsers"
          $tests = @(Get-ChildItem "$env:TRAINER_ROOT\tests\*.test.mjs" | ForEach-Object FullName)
          & $node --test @tests
          if ($LASTEXITCODE -ne 0) { throw 'Browser tests failed' }
      - name: Four workers save actual practice and restart
        shell: pwsh
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$env:TRAINER_ROOT\Run.ps1" -Workers 4 -Rounds 1 -TrainingCount 2 -EvaluationCount 2 -NoBrowser -NoPause
          if ($LASTEXITCODE -ne 0) { throw 'Four-worker run failed' }
          foreach ($worker in 1..4) {
            $folder = "$env:TRAINER_ROOT\data\worker-$worker"
            $report = Get-Content "$folder\batch-00000001.json" -Raw | ConvertFrom-Json
            if (-not (Test-Path "$folder\memory.json")) { throw 'Checkpoint missing' }
            if ($report.compiled_skills -lt 1 -or $report.verified_search_practice -lt 2) { throw 'No verified learning saved' }
            if ($report.after_training.false_verified_claims -ne 0 -or $report.after_training.unsafe_actions -ne 0 -or $report.after_training.hard_violations -ne 0) { throw 'Objective safety failure' }
          }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$env:TRAINER_ROOT\Run.ps1" -Workers 1 -Rounds 1 -TrainingCount 2 -EvaluationCount 2 -NoBrowser -NoPause
          if ($LASTEXITCODE -ne 0) { throw 'Restart failed' }
          $saved = Get-Content "$env:TRAINER_ROOT\data\worker-1\worker.json" -Raw | ConvertFrom-Json
          if ($saved.completedRounds -ne 2) { throw 'Restart did not preserve progress' }
          $resumed = Get-Content "$env:TRAINER_ROOT\data\worker-1\batch-00000002.json" -Raw | ConvertFrom-Json
          if ($resumed.after_training.compiled_reuse -lt 1 -or $resumed.teacher_demonstrations -gt 1) { throw 'Saved learning was not reused' }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$env:TRAINER_ROOT\Control.ps1" -Action Results -NoPause -DestinationDirectory "$env:TRAINER_ROOT"
          if ($LASTEXITCODE -ne 0) { throw 'Results export failed' }
      - name: Varied curriculum saves four capabilities
        shell: pwsh
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$env:TRAINER_ROOT\Run.ps1" -Workers 1 -Rounds 1 -TrainingCount 12 -EvaluationCount 4 -NoBrowser -NoPause
          if ($LASTEXITCODE -ne 0) { throw 'Varied curriculum failed' }
          $report = Get-Content "$env:TRAINER_ROOT\data\worker-1\batch-00000003.json" -Raw | ConvertFrom-Json
          foreach ($lesson in @('search','constrain_numeric','open_item','next_page')) {
            if ($report.lesson_counts.$lesson -ne 3) { throw "Lesson did not verify: $lesson" }
            if ($report.compiled_capabilities -notcontains $lesson) { throw "No compiled procedure: $lesson" }
          }
          if ($report.after_training.rare_classification_errors -ne 0 -or $report.after_training.success_rate -ne 1) { throw 'Held-out objective failed' }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$env:TRAINER_ROOT\Run.ps1" -Workers 1 -Rounds 1 -TrainingCount 12 -EvaluationCount 2 -NoBrowser -NoPause
          if ($LASTEXITCODE -ne 0) { throw 'Drawer curriculum failed' }
          $drawer = Get-Content "$env:TRAINER_ROOT\data\worker-1\batch-00000004.json" -Raw | ConvertFrom-Json
          if ($drawer.lesson_counts.constrain_numeric -ne 3) { throw 'Drawer lessons did not verify' }
          if (-not ($drawer.evaluation_rows | Where-Object { $_.reused_capabilities -contains 'constrain_numeric' })) { throw 'Compiled drawer filter was not reused in held-out evaluation' }
      - name: Actual launch, duplicate protection, dashboard, and stop
        shell: pwsh
        run: |
          $paths = Get-Content "$env:TRAINER_ROOT\.runtime\paths.json" -Raw | ConvertFrom-Json
          $node = Join-Path "$env:TRAINER_ROOT\.runtime" $paths.node
          & $node "$env:TRAINER_ROOT\tests\station-smoke.mjs"
          if ($LASTEXITCODE -ne 0) { throw 'Launcher lifecycle smoke failed' }
          if (Get-ChildItem "$env:TRAINER_ROOT\data\worker-*\worker-errors.log" | Select-String -Pattern 'EPIPE') { throw 'Shutdown produced a broken-pipe error' }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::OpenRead("$env:TRAINER_ROOT\Site-Brain-Training-Results.zip")
          try { if ($zip.Entries.FullName -notcontains 'bundle-manifest.json') { throw 'Results omit build identity' } }
          finally { $zip.Dispose() }
      - name: In-place update preserves memory and resumes learned procedures
        shell: pwsh
        run: |
          $memory = "$env:TRAINER_ROOT\data\worker-1\memory.json"
          $record = "$env:TRAINER_ROOT\data\worker-1\worker.json"
          $memoryHash = (Get-FileHash $memory).Hash
          $recordHash = (Get-FileHash $record).Hash
          $archive = (Resolve-Path dist/Site-Brain-Trainer.zip).Path
          $hash = (Get-FileHash $archive).Hash.ToLowerInvariant()
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$env:TRAINER_ROOT\Update.ps1" -ArchivePath $archive -ExpectedHash $hash -NoPause
          if ($LASTEXITCODE -ne 0) { throw 'In-place update failed' }
          if ((Get-FileHash $memory).Hash -ne $memoryHash -or (Get-FileHash $record).Hash -ne $recordHash) { throw 'Update changed saved learning' }
          $saved = Get-Content $record -Raw | ConvertFrom-Json
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$env:TRAINER_ROOT\Run.ps1" -Workers 1 -Rounds 1 -TrainingCount 12 -EvaluationCount 2 -NoBrowser -NoPause
          if ($LASTEXITCODE -ne 0) { throw 'Updated trainer could not resume' }
          $after = Get-Content $record -Raw | ConvertFrom-Json
          if ($after.completedRounds -ne ($saved.completedRounds + 1)) { throw 'Update lost progress' }
          $batch = Join-Path (Split-Path $record) ('batch-' + $after.completedRounds.ToString('00000000') + '.json')
          $report = Get-Content $batch -Raw | ConvertFrom-Json
          if ($report.after_training.compiled_reuse -lt 1) { throw 'Update did not retain learned procedures' }
      - name: One control window starts, stops, and saves to Downloads
        shell: pwsh
        run: |
          Remove-Item "$env:TRAINER_ROOT\.runtime\ready.txt"
          & powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File "$env:TRAINER_ROOT\Trainer.ps1" -SmokeTest
          if ($LASTEXITCODE -ne 0) { throw 'Control window failed' }
          $downloads = (New-Object -ComObject Shell.Application).NameSpace('shell:Downloads').Self.Path
          if (-not (Test-Path (Join-Path $downloads 'Site-Brain-Training-Results.zip'))) { throw 'Results were not saved to Downloads' }
      - name: Publish tested trainer update
        if: github.event_name == 'push' && github.ref == 'refs/heads/codex/trainer-curriculum-update'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $head = gh api "repos/$env:GITHUB_REPOSITORY/git/ref/heads/codex/trainer-curriculum-update" --jq '.object.sha'
          if ($head -ne $env:GITHUB_SHA) { Write-Host 'A newer trainer build is being tested; skipping publication.'; exit 0 }
          $notes = "Trainer 1.1.0. One control window; updates preserve memories. Source: $env:GITHUB_SHA"
          gh release view site-brain-trainer-latest --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) { gh release create site-brain-trainer-latest --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'Site Brain Trainer' --latest=false --notes $notes }
          gh release upload site-brain-trainer-latest dist/Site-Brain-Trainer.zip --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Trainer upload failed' }
          gh release edit site-brain-trainer-latest --repo $env:GITHUB_REPOSITORY --latest=false --notes $notes
          if ($LASTEXITCODE -ne 0) { throw 'Trainer release update failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: Site-Brain-Trainer-Windows
          path: dist/Site-Brain-Trainer.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-trainer-test-results
          path: |
            ${{ env.TRAINER_ROOT }}/data/
            ${{ env.TRAINER_ROOT }}/Site-Brain-Training-Results.zip
