name: Build AppGate APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: appgate-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      AI_BROWSER_SIGNING_PASSWORD: ${{ secrets.AI_BROWSER_SIGNING_PASSWORD }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Prepare Claude v3 release source
        run: |
          rm -rf claude-v3-src
          mkdir claude-v3-src
          unzip -q AI-Browser-Site-Brain-v3.zip -d claude-v3-src
          sed -i 's/it.message/it?.message/g' claude-v3-src/app/src/main/java/com/appgate/tv/MainActivity.kt
          # KSL: never force the account login URL. Open KSL normally and reuse the single Gecko profile/session.
          sed -i 's#https://www.ksl.com/login#https://www.ksl.com/#g' claude-v3-src/brain-core/src/main/kotlin/com/appgate/brain/profile/SiteProfiles.kt
          # Overnight learner: keep the partial wake lock through a normal overnight test window.
          sed -i 's/acquire(6 \* 60 \* 60 \* 1000L)/acquire(10 * 60 * 60 * 1000L)/' claude-v3-src/app/src/main/java/com/appgate/tv/service/BrainService.kt
          # Circuit breaker: stop identical no-target actions at the execution layer, including paths that bypass the outer skill counter.
          python3 - <<'PY'
          from pathlib import Path
          p=Path("claude-v3-src/brain-core/src/main/kotlin/com/appgate/brain/engine/BrainEngine.kt")
          x=p.read_text()
          x=x.replace('''                if (ledger.currentProgram.isNotEmpty() && ledger.cursor < ledger.currentProgram.size) {
                    runProgramStep(ledger, sps, site, profile, executor, effectiveMode)
                    consecutiveNoAction = 0
                    continue
                }''','''                if (ledger.currentProgram.isNotEmpty() && ledger.cursor < ledger.currentProgram.size) {
                    runProgramStep(ledger, sps, site, profile, executor, effectiveMode)
                    consecutiveNoAction = 0
                    if (ledger.consecutiveFailures >= 3) {
                        events.log("warn", "circuit breaker: ${ledger.consecutiveFailures} repeated failures on ${sps.host}; escalating to planner")
                        if (askPlanner(ledger, sps, site, profile, "repeated deterministic failures")) {
                            ledger.consecutiveFailures = 0
                        } else if (!exploratoryFallback(ledger, sps)) {
                            ledger.status = if (ledger.verdicts.isNotEmpty()) TaskStatus.DONE else TaskStatus.FAILED
                            ledger.note("circuit breaker stopped repeated failure loop")
                        }
                        memory.saveLedger(ledger)
                    }
                    continue
                }''')
          x=x.replace('''                events.step(ledger, "no target for ${step.describe()}", VerifyStatus.FAILED)
                recordFailureMemory(site, sps, step, "no_target")''','''                events.step(ledger, "no target for ${step.describe()}", VerifyStatus.FAILED)
                ledger.consecutiveFailures++
                val failureKey = "no_target:" + sps.host + ":" + step.describe()
                val repeatedNoTarget = ledger.notes.takeLast(12).count { it == failureKey }
                ledger.note(failureKey)
                recordFailureMemory(site, sps, step, "no_target")
                if (repeatedNoTarget >= 2 || ledger.consecutiveFailures >= 5) {
                    events.log("warn", "progress watchdog: goal/action made no progress; abandoning " + step.describe() + " and escalating")
                    ledger.currentProgram = emptyList()
                    ledger.cursor = 0
                    if (askPlanner(ledger, sps, site, profile, "repeated no-target action: " + step.describe())) {
                        ledger.consecutiveFailures = 0
                    } else {
                        ledger.note("planner unavailable; watchdog forcibly completed blocked task so overnight scheduler can move on")
                        ledger.currentProgram = emptyList()
                        ledger.cursor = 0
                        ledger.status = TaskStatus.DONE
                        ledger.consecutiveFailures = 0
                    }
                    memory.saveLedger(ledger)
                    return
                }''')
          p.write_text(x)
          PY
          sed -i -E 's/versionCode[[:space:]]+[0-9]+/versionCode 76/' claude-v3-src/app/build.gradle
          sed -i -E 's/versionName[[:space:]]+"[^"]+"/versionName "7.0.6-site-brain-v3"/' claude-v3-src/app/build.gradle

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'

      - name: Use Claude v3 Android project
        id: proj
        run: echo "dir=claude-v3-src" >> "$GITHUB_OUTPUT"

      - name: Run Site Brain core tests
        working-directory: ${{ steps.proj.outputs.dir }}
        run: gradle :brain-core:test --stacktrace

      - name: Run Android unit tests
        working-directory: ${{ steps.proj.outputs.dir }}
        run: gradle testDebugUnitTest --stacktrace

      - name: Build debug APK
        working-directory: ${{ steps.proj.outputs.dir }}
        run: gradle assembleDebug --stacktrace

      - name: Prepare persistent release signing key
        id: signing
        if: github.event_name == 'push' && github.ref == 'refs/heads/ai-browser-v6-deep-search'
        shell: bash
        run: |
          set +x
          RAW="${AI_BROWSER_SIGNING_PASSWORD:-}"
          if [ -z "$RAW" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "reason=missing_secret" >> "$GITHUB_OUTPUT"
            echo "Stable signing secret is not configured yet. Debug APK will be built, but it will NOT be published as an in-app update."
            exit 0
          fi

          base64 -d signing/aibrowser-upload.jks.enc.b64 > "$RUNNER_TEMP/aibrowser-upload.jks.enc"

          trim() {
            printf '%s' "$1" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'
          }

          try_password() {
            local candidate="$1"
            [ -n "$candidate" ] || return 1
            rm -f "$RUNNER_TEMP/aibrowser-upload.jks"
            if ! AI_BROWSER_CANDIDATE="$candidate" openssl enc -d -aes-256-cbc -pbkdf2               -in "$RUNNER_TEMP/aibrowser-upload.jks.enc"               -out "$RUNNER_TEMP/aibrowser-upload.jks"               -pass env:AI_BROWSER_CANDIDATE >/dev/null 2>&1; then
              return 1
            fi
            if ! keytool -list -keystore "$RUNNER_TEMP/aibrowser-upload.jks"               -storepass "$candidate" -alias aibrowser >/dev/null 2>&1; then
              return 1
            fi
            printf '%s' "$candidate" > "$RUNNER_TEMP/aibrowser-signing-password"
            return 0
          }

          TRIMMED="$(trim "$RAW")"
          WITHOUT_PREFIX="$(printf '%s' "$TRIMMED" | sed -E 's/^[[:space:]]*AI_BROWSER_SIGNING_PASSWORD[[:space:]]*=[[:space:]]*//')"
          UNQUOTED="$(printf '%s' "$WITHOUT_PREFIX" | sed -E 's/^["'\'']//; s/["'\'']$//')"
          EXTRACTED="$(printf '%s\n' "$RAW" | tr -d '\r' | grep -E '^[A-Za-z0-9_-]{32,}$' | head -1 || true)"

          RESOLVED=""
          for candidate in "$RAW" "$TRIMMED" "$WITHOUT_PREFIX" "$UNQUOTED" "$EXTRACTED" "_$TRIMMED" "_$WITHOUT_PREFIX" "_$UNQUOTED"; do
            if try_password "$candidate"; then
              RESOLVED="$candidate"
              break
            fi
          done

          if [ -z "$RESOLVED" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "reason=password_mismatch" >> "$GITHUB_OUTPUT"
            echo "Stable signing secret is present, but it does not unlock the permanent signing key."
            echo "No incompatible update will be published."
            exit 0
          fi

          echo "::add-mask::$RESOLVED"
          echo "AI_BROWSER_SIGNING_PASSWORD=$RESOLVED" >> "$GITHUB_ENV"
          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "reason=ready" >> "$GITHUB_OUTPUT"
          echo "keystore=$RUNNER_TEMP/aibrowser-upload.jks" >> "$GITHUB_OUTPUT"
          echo "Permanent signing key prepared successfully."

      - name: Build stable signed release APK
        if: steps.signing.outputs.ready == 'true'
        working-directory: ${{ steps.proj.outputs.dir }}
        env:
          AI_BROWSER_KEYSTORE_PATH: ${{ steps.signing.outputs.keystore }}
        run: gradle assembleRelease --stacktrace

      - name: Verify stable signing certificate
        if: steps.signing.outputs.ready == 'true'
        run: |
          APK=$(find . -path '*/app/build/outputs/apk/release/app-release.apk' -print -quit)
          test -n "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"
          CERT_OUTPUT=$("$APKSIGNER" verify --print-certs "$APK" 2>&1)
          printf '%s\n' "$CERT_OUTPUT"
          ACTUAL=$(printf '%s\n' "$CERT_OUTPUT" | sed -n 's/^.*certificate SHA-256 digest: //p' | head -1 | tr -d ': \r' | tr '[:upper:]' '[:lower:]')
          EXPECTED="118079b156fabeae30aca7ad845f1a15cd7eea89740bc1472be2163400d40239"
          echo "Stable signer SHA-256: $ACTUAL"
          test -n "$ACTUAL"
          test "$ACTUAL" = "$EXPECTED"

      - name: Prepare stable updater APK
        if: steps.signing.outputs.ready == 'true'
        run: |
          APK=$(find . -path '*/app/build/outputs/apk/release/app-release.apk' -print -quit)
          test -n "$APK"
          cp "$APK" AI-Browser-latest.apk
          BUILD_FILE="${{ steps.proj.outputs.dir }}/app/build.gradle"
          VERSION_CODE=$(sed -nE 's/.*versionCode[[:space:]]+([0-9]+).*/\1/p' "$BUILD_FILE" | head -1)
          VERSION_NAME=$(sed -nE 's/.*versionName[[:space:]]+"([^"]+)".*/\1/p' "$BUILD_FILE" | head -1)
          test -n "$VERSION_CODE"
          test -n "$VERSION_NAME"
          printf '{"versionCode":%s,"versionName":"%s","commit":"%s"}\n' "$VERSION_CODE" "$VERSION_NAME" "$GITHUB_SHA" > latest-version.json

      - name: Publish stable latest release for in-app Update button
        if: steps.signing.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CURRENT_HEAD=$(git ls-remote origin refs/heads/ai-browser-v6-deep-search | awk '{print $1}')
          if [ "$CURRENT_HEAD" != "$GITHUB_SHA" ]; then
            echo "Skipping stale updater publish: branch has moved to $CURRENT_HEAD"
            exit 0
          fi
          if gh release view ai-browser-latest >/dev/null 2>&1; then
            gh release upload ai-browser-latest AI-Browser-latest.apk latest-version.json --clobber
            gh release edit ai-browser-latest --title "AI Browser Latest" --notes "Stable-signed AI Browser build. Future builds use the same signing identity so Android can update in place."
          else
            gh release create ai-browser-latest AI-Browser-latest.apk latest-version.json --title "AI Browser Latest" --notes "Stable-signed AI Browser build. Future builds use the same signing identity so Android can update in place."
          fi

      - name: Disable incompatible updater asset when stable signing is unavailable
        if: github.event_name == 'push' && github.ref == 'refs/heads/ai-browser-v6-deep-search' && steps.signing.outputs.ready != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view ai-browser-latest >/dev/null 2>&1; then
            gh release delete-asset ai-browser-latest AI-Browser-latest.apk -y >/dev/null 2>&1 || true
            gh release delete-asset ai-browser-latest latest-version.json -y >/dev/null 2>&1 || true
            gh release edit ai-browser-latest --title "AI Browser Latest" --notes "Update publishing is temporarily paused while persistent Android signing is being configured. Existing Site Brain data is not affected."
          fi

      - name: Package full source for external AI review
        if: github.event_name == 'push' && github.ref == 'refs/heads/ai-browser-v6-deep-search'
        run: |
          git archive --format=zip --output=AI-Browser-Claude-Review.zip HEAD

      - name: Upload full source review ZIP
        if: github.event_name == 'push' && github.ref == 'refs/heads/ai-browser-v6-deep-search'
        uses: actions/upload-artifact@v4
        with:
          name: AI-Browser-Claude-Review
          path: AI-Browser-Claude-Review.zip
          if-no-files-found: error

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AppGate-debug-apk
          path: '**/app/build/outputs/apk/debug/app-debug.apk'
          if-no-files-found: error

      - name: Upload stable signed APK artifact
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: AI-Browser-stable-signed-apk
          path: '**/app/build/outputs/apk/release/app-release.apk'
          if-no-files-found: error

      - name: Report stable signing setup problem
        if: github.event_name == 'push' && github.ref == 'refs/heads/ai-browser-v6-deep-search' && steps.signing.outputs.ready != 'true'
        run: |
          echo "Stable signing is not ready: ${{ steps.signing.outputs.reason }}"
          echo "Debug build and tests completed, but no update APK was published."
          exit 1
