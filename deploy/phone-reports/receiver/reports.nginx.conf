server {
    listen 80;
    server_name reports.ryzod.com;
    access_log off;
    error_log /dev/null crit;
    client_max_body_size 1m;
    client_body_buffer_size 1m;
    client_body_timeout 20s;
    location / {
        # TLS is provisioned before enabling the receiver routes.
        return 503;
    }
}
