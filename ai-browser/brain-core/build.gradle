plugins {
    id 'org.jetbrains.kotlin.jvm'
}

// The Site Brain core: pure Kotlin, zero dependencies, identical on Android, in the JVM test
// harness and in the offline replay lab. Everything the brain "thinks" lives here; the app
// module only supplies the renderer (GeckoView) and the UI.
kotlin {
    jvmToolchain(17)
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}

test {
    useJUnit()
    // The recorded extractor observations used by the perception tests.
    systemProperty 'brain.fixtures', file('src/test/fixtures').absolutePath
}

// Offline training/evaluation is deliberately absent from the Android production jar.
sourceSets {
    lab {
        kotlin.srcDir 'src/lab/kotlin'
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
    test {
        compileClasspath += sourceSets.lab.output
        runtimeClasspath += sourceSets.lab.output
    }
}
configurations.labImplementation.extendsFrom(configurations.implementation)
configurations.labRuntimeOnly.extendsFrom(configurations.runtimeOnly)

tasks.register('simulationExperiment', JavaExec) {
    group = 'verification'
    description = 'Frozen-memory baseline, training and held-out marketplace evaluation (no network).'
    classpath = sourceSets.lab.runtimeClasspath
    mainClass = 'com.appgate.brain.lab.SimulationMainKt'
    args layout.buildDirectory.file('reports/brain/simulation.json').get().asFile.absolutePath
}
