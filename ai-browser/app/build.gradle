plugins {
    id 'com.android.application'
}

def stableKeystorePath = System.getenv('AI_BROWSER_KEYSTORE_PATH')
def stableSigningPassword = System.getenv('AI_BROWSER_SIGNING_PASSWORD')
def stableSigningEnabled = stableKeystorePath && stableSigningPassword

def serverAndroidLab = providers.gradleProperty('serverAndroidLab').orNull == 'true'

android {
    buildFeatures { buildConfig true }
    namespace 'com.appgate.tv'
    compileSdk 37

    defaultConfig {
        def diagnosticsRevision = ["git", "rev-parse", "HEAD"].execute(null, rootDir).text.trim()
        buildConfigField "String", "DIAGNOSTICS_REVISION", "\"${diagnosticsRevision}\""
        testInstrumentationRunner "com.appgate.tv.serverlab.ServerLabInstrumentation"
        applicationId "com.aibrowser.universal"
        minSdk 26
        targetSdk 34
        ndk {
            abiFilters 'arm64-v8a'
        }
        versionCode 70
        versionName "7.0.0-site-brain-v3"
    }

    signingConfigs {
        stableRelease {
            if (stableSigningEnabled) {
                storeFile file(stableKeystorePath)
                storePassword stableSigningPassword
                keyAlias 'aibrowser'
                keyPassword stableSigningPassword
            }
        }
    }

    buildTypes {
        debug {
            if (serverAndroidLab) {
                applicationIdSuffix '.serverlab'
                ndk { abiFilters.clear(); abiFilters 'x86_64' }
            }
            buildConfigField 'boolean', 'SERVER_ANDROID_LAB', serverAndroidLab.toString()
        }
        release {
            minifyEnabled false
            if (stableSigningEnabled) {
                signingConfig signingConfigs.stableRelease
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation project(':brain-core')
    implementation 'androidx.work:work-runtime-ktx:2.10.5'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    debugImplementation(serverAndroidLab
        ? 'org.mozilla.geckoview:geckoview-x86_64:155.0.20260903215306'
        : 'org.mozilla.geckoview:geckoview-arm64-v8a:155.0.20260903215306')
    releaseImplementation 'org.mozilla.geckoview:geckoview-arm64-v8a:155.0.20260903215306'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}


configurations.configureEach {
    resolutionStrategy.force 'org.jetbrains.kotlin:kotlin-stdlib:2.2.10'
    resolutionStrategy.force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:2.2.10'
    resolutionStrategy.force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:2.2.10'
}
